name: Build APK Perfectly (Pro Edition)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Kivy Android App
    runs-on: ubuntu-22.04

    steps:
    # ১. লেটেস্ট সোর্স কোড চেকআউট
    - name: Checkout code
      uses: actions/checkout@v4        # v5 এখনো নেই

    # ২. অ্যান্ড্রয়েড SDK এর জন্য জাভা এনভায়রনমেন্ট
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ৩. পাইথন এনভায়রনমেন্ট সেটআপ
    - name: Set up Python
      uses: actions/setup-python@v5    # v6 এখনো নেই
      with:
        python-version: '3.10'

    # ৪. ক্যাশিং: বারবার NDK/SDK ডাউনলোড বন্ধ করতে
    - name: Cache Buildozer Global Directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-global-

    - name: Cache Buildozer Local Directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-local-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-local-

    # ৫. গিট সেফ ডিরেক্টরি কনফিগার
    - name: Configure Git Safe Directories
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # ৬. সিস্টেম ডিপেন্ডেন্সি (libtinfo5 ubuntu-22.04 এ নেই, তাই বাদ)
    - name: Install System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          ccache lld

    # ৭. পাইথন প্যাকেজ (Cython<3.0 লক — buildozer এর জন্য জরুরি)
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "Cython<3.0" buildozer virtualenv

    # ৮. Android লাইসেন্স ফাইল তৈরি
    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    # ৯. APK বিল্ড (verbose মোডে, সঠিক কমান্ড)
    - name: Build the APK
      run: |
        buildozer -v android debug 2>&1 | tee build.log

    # ১০. বিল্ড লগ আপলোড (ফেল হলেও দেখা যাবে)
    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    # ১১. APK আপলোড
    - name: Upload the APK
      uses: actions/upload-artifact@v4
      with:
        name: New-Kivy-App
        path: bin/*.apk
