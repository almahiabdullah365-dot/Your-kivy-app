name: Build APK Perfectly

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    # গিটহাব অ্যাকশনকে আপনার ফাইলে রাইট বা লেখার পারমিশন দেওয়া (নাহলে ফাইল তৈরি হতে পারে না)
    - name: Configure Git and Permissions
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

    - name: Install Required Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    # লাইসেন্স ফাইল স্বয়ংক্রিয়ভাবে তৈরি ও গ্রহণ করা
    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build the APK
      run: |
        # প্রথম বিল্ডে অনেক ফাইল ডাউনলোড হয়, তাই স্টেপ বাই স্টেপ রান করা নিরাপদ
        buildozer android clean
        yes | buildozer android debug

    - name: Upload the APK
      uses: actions/upload-artifact@v4
      with:
        name: New-TV-App
        # ফাইলটি যেখানেই তৈরি হোক না কেন, সেটি খুঁজে বের করার জন্য ওয়াইল্ডকার্ড পাথ
        path: |
          bin/*.apk
          .buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/*/build/outputs/apk/debug/*.apk
